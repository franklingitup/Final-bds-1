{{- if .Values.controlPlane.installToken }}
# One-time installation (bootstrap) token. The generated install command
# populates controlPlane.installToken. The agent exchanges this token for
# permanent cluster credentials on first registration; afterwards the token is
# only used to recover lost state (idempotent register / recover endpoint) and
# can be rotated or revoked without disrupting a registered cluster.
#
# When installToken is empty this Secret is not rendered, allowing operators to
# manage the "{{ include "agent.name" . }}-install" Secret out-of-band (e.g. via
# an external secrets manager or sealed secrets).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.name" . }}-install
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.controlPlane.installToken | quote }}
{{- end }}
