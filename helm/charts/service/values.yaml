# Default values for a single control-plane service.
nameOverride: ""
replicaCount: 2

image:
  repository: ghcr.io/bdsplatform/platform/service
  tag: ""        # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env: []
  # - name: LOG_LEVEL
  #   value: info

envFrom: []
  # - secretRef:
  #     name: service-secrets

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  liveness: /healthz
  readiness: /readyz

serviceMonitor:
  enabled: false
