name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Tidy check
        run: go mod tidy && git diff --exit-code
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest

  integration:
    name: Integration tests (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bds_test?sslmode=disable
        run: |
          # Schema is applied by each integration test via libs/database.Migrator
          # (the same runner services use at startup). scripts/db/migrate.sh is
          # documented but not checked in. Tests are serialized (-p 1) so they
          # do not race on first-time schema_migrations_* table creation.
          echo "Using per-test database.Migrator against ${DATABASE_URL}"
      - name: Integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bds_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bds_test?sslmode=disable
          JWT_SIGNING_KEY: integration-test-signing-key
        run: go test ./... -tags=integration,integration_argocd,integration_buildconsumer -race -p 1 -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/charts/service helm/agent

  terraform:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Validate modules
        run: |
          for m in terraform/modules/*; do
            echo "==> validating $m";
            tofu -chdir="$m" init -backend=false;
            tofu -chdir="$m" validate;
          done
