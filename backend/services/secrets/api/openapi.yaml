openapi: 3.1.0
info:
  title: Secrets Service API
  description: |
    Secure project-scoped secret management for the BDS Platform.
    
    ## Security Model
    - Secrets are encrypted at rest using AES-256-GCM envelope encryption
    - Plaintext values are NEVER returned in API responses
    - Values only exist in create/update requests, never in responses
    - Events never contain plaintext values
    
    ## Authorization
    - All endpoints require authentication via Bearer token
    - Permissions are project-scoped via membership roles:
      - **viewer**: Read secret metadata only
      - **developer**: Create, update, and read metadata
      - **admin**: Full access including delete
  version: 1.0.0
  contact:
    name: Platform Team
    
servers:
  - url: /v1
    description: API v1

security:
  - bearerAuth: []

tags:
  - name: Secrets
    description: Project-scoped secret management
  - name: Agent
    description: Platform Agent endpoints (internal)

paths:
  /organizations/{orgId}/projects/{projectId}/secrets:
    post:
      operationId: createSecret
      summary: Create a secret
      description: |
        Creates a new encrypted secret within a project.
        The plaintext value is encrypted before storage and never returned.
        
        Requires: `secrets:write` permission (developer or admin role).
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
            examples:
              databaseUrl:
                summary: Database connection string
                value:
                  name: DATABASE_URL
                  value: "postgres://user:pass@host:5432/db"
                  description: Primary database connection
              apiKey:
                summary: API key
                value:
                  name: STRIPE_API_KEY
                  value: "sk_live_xxx"
                  description: Stripe production API key
      responses:
        '201':
          description: Secret created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      operationId: listSecrets
      summary: List secrets
      description: |
        Returns a paginated list of secrets in a project.
        Only metadata is returned; plaintext values are never included.
        
        Requires: `secrets:read` permission (any project member).
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List of secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretListView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{orgId}/projects/{projectId}/secrets/{secretId}:
    get:
      operationId: getSecret
      summary: Get a secret
      description: |
        Retrieves a secret's metadata by ID.
        The plaintext value is never included in the response.
        
        Requires: `secrets:read` permission (any project member).
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SecretId'
      responses:
        '200':
          description: Secret metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateSecret
      summary: Update a secret
      description: |
        Updates a secret's value and/or description.
        If a new value is provided, it is encrypted before storage.
        The plaintext value is never returned.
        
        Requires: `secrets:write` permission (developer or admin role).
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SecretId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretRequest'
      responses:
        '200':
          description: Secret updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deleteSecret
      summary: Delete a secret
      description: |
        Soft-deletes a secret.
        
        Requires: `secrets:manage` permission (admin role only).
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SecretId'
      responses:
        '204':
          description: Secret deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /agent/clusters/{clusterId}/secrets:
    get:
      operationId: getAgentSecrets
      summary: Get secrets for a cluster (Agent only)
      description: |
        Returns decrypted secrets for all projects with active deployments on the cluster.
        
        **This is the ONLY endpoint that returns plaintext values.**
        
        Authentication: X-Cluster-ID and X-Agent-ID headers required.
        
        Security controls:
        - Agent credentials are validated against cluster registration
        - Only returns secrets for projects with deployments on this cluster
        - Query executes within tenant context for RLS enforcement
      tags:
        - Agent
      security:
        - agentAuth: []
      parameters:
        - $ref: '#/components/parameters/ClusterId'
      responses:
        '200':
          description: List of decrypted secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSecretsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from Auth Service
    agentAuth:
      type: apiKey
      in: header
      name: X-Cluster-ID
      description: |
        Agent authentication requires both X-Cluster-ID and X-Agent-ID headers.
        These are validated against the cluster registration.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid
        
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project UUID
      schema:
        type: string
        format: uuid
        
    SecretId:
      name: secretId
      in: path
      required: true
      description: Secret UUID
      schema:
        type: string
        format: uuid
        
    ClusterId:
      name: clusterId
      in: path
      required: true
      description: Cluster UUID
      schema:
        type: string
        format: uuid
        
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return (1-100, default 25)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
        
    Cursor:
      name: cursor
      in: query
      description: Pagination cursor for the next page
      schema:
        type: string

  schemas:
    CreateSecretRequest:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: |
            Secret name. Must start with uppercase letter and contain only
            uppercase letters, digits, and underscores. Max 255 characters.
          pattern: '^[A-Z][A-Z0-9_]{0,254}$'
          example: DATABASE_URL
        value:
          type: string
          description: |
            Plaintext secret value. Encrypted before storage.
            Only present in requests, never in responses.
            Max 64KB.
          maxLength: 65536
          example: "postgres://user:pass@host:5432/db"
        description:
          type: string
          description: Optional description of the secret
          example: Primary database connection string

    UpdateSecretRequest:
      type: object
      properties:
        value:
          type: string
          description: |
            New plaintext value. Encrypted before storage.
            Only present in requests, never in responses.
          maxLength: 65536
        description:
          type: string
          description: Updated description

    SecretView:
      type: object
      description: |
        Secret metadata. **Plaintext value is NEVER included.**
      properties:
        id:
          type: string
          format: uuid
          description: Secret UUID
        projectId:
          type: string
          format: uuid
          description: Project UUID
        name:
          type: string
          description: Secret name
          example: DATABASE_URL
        description:
          type: string
          description: Secret description
        version:
          type: integer
          format: int64
          description: Version for optimistic locking
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    SecretListView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecretView'
        total:
          type: integer
          description: Number of items in this page
        hasMore:
          type: boolean
          description: Whether more items exist
        nextCursor:
          type: string
          description: Cursor for the next page (if hasMore is true)

    AgentSecret:
      type: object
      description: |
        Secret with decrypted value for agent consumption.
        **Only returned by the agent endpoint.**
      properties:
        projectId:
          type: string
          format: uuid
          description: Project UUID
        name:
          type: string
          description: Secret name
          example: DATABASE_URL
        value:
          type: string
          description: Decrypted plaintext value
        version:
          type: integer
          format: int64
          description: Secret version

    AgentSecretsResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/AgentSecret'

    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: "secret name must start with uppercase letter"
            
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: "invalid or missing access token"
            
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: "insufficient permissions"
            
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: "secret not found"
            
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: "secret with this name already exists"
